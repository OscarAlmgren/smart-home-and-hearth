homeassistant:
  name: !secret home_name
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  time_zone: !secret home_timezone

  # Everything else lives in packages/, one file per concern. Packages merge
  # into the top-level config, so packages/recorder.yaml contributing a
  # `recorder:` block is equivalent to writing it here — just reviewable in
  # isolation and easier to diff per environment.
  packages: !include_dir_named packages

default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
