apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment: prod — branch `main`, auto-synced by Argo CD.
# The only environment that runs a live Home Assistant.
#
#   kubectl kustomize k8s/overlays/prod --load-restrictor LoadRestrictionsNone

namespace: ha-prod

resources:
  - ../../base
  - ../../base/monitoring
  - ../../base/backup
  - secrets

# Must match HA_VERSION in .env.prod.
# `scripts/render-env.sh --check` enforces this; CI fails the build on drift.
images:
  - name: ghcr.io/home-assistant/home-assistant
    newTag: 2026.7.4

configMapGenerator:
  # Replaces the base generator so this environment reads its own env file.
  # `behavior: replace` requires a same-named generator in the base, which
  # exists.
  - name: ha-env
    behavior: replace
    envs:
      - ../../../.env.prod

patches: []
  # ═══════════════════════════════════════════════════════════════════════════
  # PHASE 0 — THE ZIGBEE RADIO IS NOT ATTACHED YET.
  #
  # The dongle patch is disabled so the platform can be brought up and verified
  # without hardware. The base leaves the volume at `/dev/null` with an
  # unvalidated hostPath type, which mounts cleanly and lets Home Assistant
  # start normally — it simply has no radio, which is correct for now.
  #
  # ── TO ENABLE THE RADIO ────────────────────────────────────────────────────
  #
  #   1. Plug the dongle into a USB 2.0 port on an extension cable
  #      (USB 3.0 emits 2.4 GHz noise that wrecks Zigbee — docs/hardware.md).
  #
  #   2. Find its stable path on the server:
  #          ls -l /dev/serial/by-id/
  #
  #   3. Put that path into patches/zigbee-device.yaml, replacing REPLACE_ME.
  #
  #   4. Replace `patches: []` above with:
  #          patches:
  #            - path: patches/zigbee-device.yaml
  #
  #   5. Commit, promote dev -> test -> main, let Argo CD sync, then add the
  #      ZHA integration in the Home Assistant UI.
  #
  # CI fails the build if the patch is enabled while REPLACE_ME is still in
  # place, so you cannot half-do this. Once enabled, the hostPath type is
  # CharDevice, meaning the pod refuses to start if the dongle is absent —
  # deliberate, so a missing radio is loud rather than silent.
  # ═══════════════════════════════════════════════════════════════════════════
