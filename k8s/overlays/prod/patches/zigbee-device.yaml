# Attaches the real Zigbee coordinator.
#
# ─────────────────────────────────────────────────────────────────────────────
# CURRENTLY DISABLED. This file is not referenced — `patches:` in
# ../kustomization.yaml is empty while the dongle is not yet fitted. See the
# PHASE 0 block there for how to turn it on.
#
# Editing this file alone changes nothing.
# ─────────────────────────────────────────────────────────────────────────────
#
# Strategic merge, so `volumes` merges on the `name` key rather than by list
# index — reordering volumes in the base cannot silently repoint this at the
# wrong thing.
#
# ─────────────────────────────────────────────────────────────────────────────
# REPLACE THE PATH BELOW before the first prod sync. Find it on the server:
#
#     ls -l /dev/serial/by-id/
#     # usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_<serial>-if00-port0
#
# Do NOT substitute /dev/ttyACM0. That name is assigned in kernel enumeration
# order, so once the Thread dongle is added in phase 2 the two radios can swap
# after a reboot and ZHA will silently attach to the wrong one.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
spec:
  template:
    spec:
      volumes:
        - name: zigbee
          hostPath:
            path: /dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_REPLACE_ME-if00-port0
            type: CharDevice
