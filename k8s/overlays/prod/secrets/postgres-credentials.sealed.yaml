# PLACEHOLDER — regenerate with ./scripts/seal-secrets.sh before first sync.
#
# Keys: username, password.
#
# These must agree with recorder_db_url in ha-secrets. Nothing validates that
# for you — a mismatch surfaces as Home Assistant failing to start with a
# connection error buried in the recorder logs.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: ha-prod
spec:
  encryptedData: {}
  template:
    metadata:
      name: postgres-credentials
      namespace: ha-prod
    type: Opaque
