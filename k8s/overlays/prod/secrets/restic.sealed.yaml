# PLACEHOLDER — regenerate with ./scripts/seal-secrets.sh before first sync.
#
# Consumed by the backup CronJob. Keys:
#   repository             restic repo URL, e.g. s3:http://minio.lan:9000/ha-backups
#   password               restic encryption passphrase
#   aws-access-key-id      MinIO access key
#   aws-secret-access-key  MinIO secret key
#
# ─────────────────────────────────────────────────────────────────────────────
# THE RESTIC PASSWORD IS NOT RECOVERABLE. Lose it and every backup is
# permanently unreadable — there is no reset, no escrow, no support path.
#
# Store it somewhere that survives the loss of this machine AND this cluster:
# a password manager, not a file on henrybook. It is the one credential that
# cannot live only in Sealed Secrets, because restoring Sealed Secrets requires
# the sealing key, and restoring the sealing key requires the backup, which
# requires this password.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: restic
  namespace: ha-prod
spec:
  encryptedData: {}
  template:
    metadata:
      name: restic
      namespace: ha-prod
    type: Opaque
