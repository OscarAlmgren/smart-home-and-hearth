# PLACEHOLDER — regenerate with ./scripts/seal-secrets.sh before first sync.
#
# Consumed by Grafana Alloy. Keys:
#   prometheus-url       Prometheus remote_write endpoint
#   prometheus-username  the numeric Grafana Cloud instance ID
#   loki-url             Loki push endpoint
#   loki-username        the numeric Loki instance ID (DIFFERENT from the above)
#   api-token            one Cloud Access Policy token, used for both
#   ha-token             Home Assistant long-lived access token for /api/prometheus
#
# Where to find each of these: docs/grafana-cloud.md § Credentials.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-cloud
  namespace: ha-prod
spec:
  encryptedData: {}
  template:
    metadata:
      name: grafana-cloud
      namespace: ha-prod
    type: Opaque
