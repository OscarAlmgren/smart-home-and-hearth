apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sealed Secrets for the prod namespace.
#
# THE FILES HERE ARE PLACEHOLDERS WITH EMPTY encryptedData. They build cleanly
# so CI can validate structure, but they carry no actual secret material and
# Home Assistant will not start against them.
#
# Populate them during cluster bring-up:
#
#     ./scripts/seal-secrets.sh
#
# That script reads plaintext values you supply interactively, encrypts them
# with the cluster's public key via `kubeseal`, and rewrites these files. The
# result IS meant to be committed — that is the entire point of Sealed Secrets:
# ciphertext in git that only this cluster can decrypt, so the whole install
# rebuilds from the repository after a disk failure.
#
# The private half of that key pair lives only in the cluster. Back it up —
# without it these files are permanently undecryptable. See
# docs/disaster-recovery.md § The sealing key.

resources:
  - ha-secrets.sealed.yaml
  - postgres-credentials.sealed.yaml
  - grafana-cloud.sealed.yaml
  - restic.sealed.yaml
