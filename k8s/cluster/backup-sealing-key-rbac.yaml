# Lets the backup job in ha-prod read the Sealed Secrets private keys.
#
# APPLIED SEPARATELY by scripts/bootstrap-microk8s.sh, NOT through Kustomize.
#
# These resources live in the `sealed-secrets` namespace. Every overlay sets
# `namespace:`, and Kustomize's namespace transformer rewrites metadata.namespace
# on every namespaced resource it builds — it would move these into ha-prod,
# where they grant nothing. The failure is silent at apply time and only shows
# up as an empty sealing-key export months later, so they are kept out of the
# overlay build entirely.
#
# Scoped to exactly the label the controller puts on its key Secrets, and to
# `get`/`list` only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-read-sealing-keys
  namespace: sealed-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-read-sealing-keys
  namespace: sealed-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-read-sealing-keys
subjects:
  - kind: ServiceAccount
    name: backup
    namespace: ha-prod
