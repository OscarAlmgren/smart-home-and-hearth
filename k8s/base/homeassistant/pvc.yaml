apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ha-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: microk8s-hostpath
  resources:
    requests:
      # NOTE: microk8s-hostpath does NOT enforce this. It is bookkeeping — the
      # real limit is free space on /. A runaway .storage or log file will
      # happily consume the whole 12 GiB filesystem regardless of what is
      # written here. The root-filesystem alert in Grafana Cloud is what
      # actually protects you.
      #
      # Sized for the 16 GB flash module. Ask Oscar before changing — CLAUDE.md.
      storage: 300Mi
