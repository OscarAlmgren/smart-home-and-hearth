apiVersion: v1
kind: Namespace
metadata:
  # Renamed per environment by the overlay's `namespace:` field — Kustomize
  # special-cases Namespace resources and rewrites metadata.name as well as
  # every other resource's metadata.namespace.
  name: ha-base
  labels:
    # Home Assistant runs privileged (serial device access) with hostNetwork
    # (mDNS/SSDP discovery). Without this label, Pod Security admission rejects
    # the pod outright with a message about privileged containers.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
