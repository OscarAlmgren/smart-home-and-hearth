apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  # Headless — the StatefulSet needs it for stable DNS, and there is exactly
  # one replica so load balancing is meaningless.
  #
  # Home Assistant reaches this at postgres.<namespace>.svc.cluster.local:5432,
  # which is why the HA pod needs dnsPolicy: ClusterFirstWithHostNet. With
  # plain hostNetwork DNS it would resolve against the host's resolver and
  # never find the Service.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
