# Required by otbr.container. podman 5.7.0 rejects per-container Sysctl=
# under Network=host ("can't be set since Network Namespace set to host:
# invalid argument") - with host networking the container IS the host
# netns, so these have to be set here instead. Installed by
# scripts/bootstrap-podman.sh into /etc/sysctl.d/.
#
# Depends on `accept-ra: true` for enp3s0 in /etc/netplan/. With IPv6
# forwarding on, systemd-networkd otherwise stops processing router
# advertisements, and the host loses its SLAAC address, its IPv6 default route
# and the RA-learned routes to other Thread border routers' networks. See
# docs/podman-deploy.md § Host prerequisites.
net.ipv4.conf.all.forwarding=1
net.ipv6.conf.all.forwarding=1
