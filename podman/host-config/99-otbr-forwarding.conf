# Required by otbr.container. podman 5.7.0 rejects per-container Sysctl=
# under Network=host ("can't be set since Network Namespace set to host:
# invalid argument") - with host networking the container IS the host
# netns, so these have to be set here instead. Installed by
# scripts/bootstrap-podman.sh into /etc/sysctl.d/.
net.ipv4.conf.all.forwarding=1
net.ipv6.conf.all.forwarding=1
