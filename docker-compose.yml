services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:${HA_VERSION:-stable}
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    # privileged + host networking is the upstream-recommended baseline:
    # it's what mDNS/SSDP discovery and USB devices (Zigbee/Z-Wave sticks) need.
    privileged: true
    network_mode: host
    environment:
      - TZ=${TZ:-Etc/UTC}
